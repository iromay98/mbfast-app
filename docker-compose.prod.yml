# 本番VPS用（常時公開・自動HTTPS）。同ディレクトリの .env を読み込む。
#
#   1) cp .env.production.example .env して値を埋める（DOMAIN/AUTH_SECRET/AutoTuner 等）
#   2) DOMAIN の A レコードを VPS の IP に向ける（80/443 開放）
#   3) 初回:   SEED_ON_START=1 docker compose -f docker-compose.prod.yml up -d --build
#      2回目以降: docker compose -f docker-compose.prod.yml up -d --build
#
# postgres と app はホストに公開しない（インターネットからは Caddy 経由のみ）。
# データ(DB/アップロード)は名前付きボリュームに永続化され、再デプロイで消えない。
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Tokyo
      POSTGRES_USER: mbfast
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD を .env に設定してください}"
      POSTGRES_DB: mbfast
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mbfast -d mbfast"]
      interval: 5s
      timeout: 5s
      retries: 12
    # ホスト公開なし（内部ネットワークのみ）

  app:
    # 通常はGitHub Actionsが作ったイメージを使う（VPSでビルドしない＝速い・軽い）。
    # Actionsが使えない緊急時だけ `up -d --build` でローカルビルドにフォールバックできる
    image: ghcr.io/iromay98/mbfast-app:main
    build: .
    restart: unless-stopped
    environment:
      TZ: Asia/Tokyo
      DATABASE_URL: "postgresql://mbfast:${POSTGRES_PASSWORD}@postgres:5432/mbfast?schema=public"
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET を .env に設定してください}"
      AUTH_URL: "https://${DOMAIN:?DOMAIN を .env に設定してください}"
      NEXTAUTH_URL: "https://${DOMAIN}"
      STORAGE_DRIVER: "local"
      STORAGE_LOCAL_DIR: "/data/storage"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-209715200}"
      NOTIFICATION_DRIVER: "${NOTIFICATION_DRIVER:-console}"
      # 価格表の自動同期（既定ON。0で無効化）
      PRICE_AUTO_SYNC: "${PRICE_AUTO_SYNC:-1}"
      # LINE通知（プッシュの保険。トークンと宛先IDが揃うと有効）
      LINE_CHANNEL_ACCESS_TOKEN: "${LINE_CHANNEL_ACCESS_TOKEN:-}"
      LINE_NOTIFY_TO: "${LINE_NOTIFY_TO:-}"
      # メール通知（プッシュの保険。SMTP_HOST と NOTIFY_EMAIL_TO が揃うと有効）
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      NOTIFY_EMAIL_TO: "${NOTIFY_EMAIL_TO:-}"
      # 加盟店本人への登録完了メール（SMTP_HOST だけで有効。差出人/返信先は mbpit@）
      STORE_MAIL_FROM: "${STORE_MAIL_FROM:-}"
      STORE_MAIL_SUPPORT: "${STORE_MAIL_SUPPORT:-}"
      # mbPIT名義の案内メール差出人（代理店登録時の店舗開設通知。未設定なら SMTP_FROM）
      PIT_MAIL_FROM: "${PIT_MAIL_FROM:-}"
      # 加盟店ホームの記事閲覧実績（GA4 Data API・未設定なら機能ごと非表示）
      GA4_PROPERTY_ID: "${GA4_PROPERTY_ID:-}"
      GA4_SA_EMAIL: "${GA4_SA_EMAIL:-}"
      GA4_SA_KEY: "${GA4_SA_KEY:-}"
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-mailto:saraya@ns-inc.jp}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL_FAST: "${ANTHROPIC_MODEL_FAST:-claude-haiku-4-5-20251001}"
      ANTHROPIC_MODEL_STRONG: "${ANTHROPIC_MODEL_STRONG:-claude-opus-4-8}"
      # mbPIT（施工記録→自動ブログ公開）
      WP_BASE_URL: "${WP_BASE_URL:-https://mbfasttuning.com}"
      WP_USER: "${WP_USER:-}"
      WP_APP_PASSWORD: "${WP_APP_PASSWORD:-}"
      # 価格表のAirtable書き戻し（代理店が貼っているAirtable埋め込みを最新に保つ）。
      # 未設定なら prices:airtable-* は起動時に止まる（書き込みはしない）。
      AIRTABLE_PAT: "${AIRTABLE_PAT:-}"
      AIRTABLE_PRICE_BASE_ID: "${AIRTABLE_PRICE_BASE_ID:-}"
      # mbPIT: Googleビジネスプロフィール（Googleマップ投稿）。
      # 方式A＝認可するGoogleアカウントはmbFASTの1つだけ。認証情報は環境変数のみ（DBに置かない）。
      # 未設定なら gbp:accounts / gbp:v4check は「未設定」で止まり、投稿もしない。
      GBP_CLIENT_ID: "${GBP_CLIENT_ID:-}"
      GBP_CLIENT_SECRET: "${GBP_CLIENT_SECRET:-}"
      GBP_REFRESH_TOKEN: "${GBP_REFRESH_TOKEN:-}"
      # 手動指定モード（一覧APIの割り当てが未承認でも先に進むための経路）。
      # この2つは識別子で秘密情報ではない。DBの紐付けがあればそちらが優先される。
      GBP_ACCOUNT_ID: "${GBP_ACCOUNT_ID:-}"
      GBP_LOCATION_MAP: "${GBP_LOCATION_MAP:-}"
      # 加盟店が管理者として招待する宛先（画面に表示する識別子。秘密情報ではない）
      GBP_MANAGER_EMAIL: "${GBP_MANAGER_EMAIL:-}"
      # 方式B: 加盟店ごとのリフレッシュトークンの暗号化鍵（未設定なら方式Aのみ）
      GBP_TOKEN_ENC_KEYS: "${GBP_TOKEN_ENC_KEYS:-}"
      # 1日の投稿上限。投稿機能の実装時に効く（今はまだ読んでいない）。
      # ここに載せておかないと .env に書いてもコンテナに渡らないため先に通しておく。
      GBP_DAILY_POST_LIMIT: "${GBP_DAILY_POST_LIMIT:-80}"
      PIT_ARTICLE_MODEL: "${PIT_ARTICLE_MODEL:-claude-sonnet-5}"
      AUTO_PUBLISH: "${AUTO_PUBLISH:-true}"
      STEALTH_MODE: "${STEALTH_MODE:-false}"
      SERVER_SECRET: "${SERVER_SECRET:-}"
      PIT_OCR_MODEL: "${PIT_OCR_MODEL:-claude-sonnet-5}"
      # 車台番号・登録番号の暗号化鍵（SERVER_SECRETとは別の鍵。docs/pii-key-management.md）
      PII_ENC_KEYS: "${PII_ENC_KEYS:-}"
      AUTOTUNER_API_BASE: "${AUTOTUNER_API_BASE:-https://api.autotuner-tool.com/v2/api/v1/master}"
      AUTOTUNER_ID: "${AUTOTUNER_ID:-}"
      AUTOTUNER_API_KEY: "${AUTOTUNER_API_KEY:-}"
      AUTOTUNER_TIMEOUT_MS: "${AUTOTUNER_TIMEOUT_MS:-30000}"
      AUTOTUNER_MAX_RETRIES: "${AUTOTUNER_MAX_RETRIES:-5}"
      # 施工証明書の共有URL・検証QRの絶対URL。未設定なら AUTH_URL→リクエストヘッダの順で決まる
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
      # ECU抽出: 何件以上のファイルに出る値を「共通の定数」として候補から外すか
      ECU_COMMON_THRESHOLD: "${ECU_COMMON_THRESHOLD:-3}"
      SEED_ON_START: "${SEED_ON_START:-0}"
      NODE_ENV: "production"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - storage:/data/storage # アップロード(スレーブ/原本/mod/写真)を永続化
    # ホスト公開なし（Caddy 経由のみ）

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TZ: Asia/Tokyo
      DOMAIN: "${DOMAIN:?DOMAIN を .env に設定してください}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # 証明書を永続化
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
