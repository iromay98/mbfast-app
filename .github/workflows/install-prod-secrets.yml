# 本番VPSの .env に secret を投入し、コンテナを作り直して反映する。
#
# なぜこれが必要か:
#   docker-compose.prod.yml の environment に列挙しただけでは値は入らない。
#   /root/mbfast-app/.env に値があり、かつコンテナを **作り直す**（up -d）必要がある。
#   その2手間を手打ちさせないための自動化。
#
# 値の流れ（リポジトリにも作業者の目にも触れない）:
#   GitHub Secrets → Actions のランナー → ssh の **標準入力** → VPSの一時ファイル → .env
#   - コマンドライン引数に値を載せない（VPSの ps から見えないようにする）
#   - ログに値を出さない（GitHub側のマスクにも任せるが、そもそも echo しない）
#   - 一時ファイルは umask 077 で作り、最後に必ず消す
#
# 使い方: Actions →「Install production secrets」→ Run workflow
#   先に Settings → Secrets and variables → Actions で値を登録しておく:
#     AIRTABLE_PAT            … Airtable の Personal Access Token（pat… で始まる）
#     AIRTABLE_PRICE_BASE_ID  … 価格Baseのid（app… で始まる）
#     GBP_CLIENT_ID           … GoogleビジネスプロフィールのOAuthクライアントID
#     GBP_CLIENT_SECRET       … 同 クライアントシークレット
#     GBP_REFRESH_TOKEN       … npm run gbp:auth で取得した refresh token
#   登録済みのものだけ投入する（未登録はスキップ）。
#
#   秘密でない識別子（GBP_ACCOUNT_ID / GBP_LOCATION_MAP / GBP_MANAGER_EMAIL 等）は
#   Secret登録せず extra_env に KEY=VALUE で直接書ける（1行1件）。
name: Install production secrets

on:
  workflow_dispatch:
    inputs:
      recreate:
        description: "コンテナを作り直して反映する（通常 yes。no なら .env の更新だけ）"
        type: choice
        # YAML は裸の yes/no を真偽値として解釈するため必ずクォートする
        # （クォート無しだと選択肢が空になり workflow_dispatch が 422 で弾かれる）
        options: ["yes", "no"]
        default: "yes"
      base_id:
        # Base ID は秘密情報ではないので、Secret登録なしで直接渡せるようにする
        # （PATだけSecretに置けばよく、利用者の手間が半分になる）。
        # 指定するとSecretの AIRTABLE_PRICE_BASE_ID より優先する。
        description: "AIRTABLE_PRICE_BASE_ID を直接指定する場合（app… ）。空ならSecretを使う"
        type: string
        required: false
      extra_env:
        # 秘密でない設定値（フラグ等）を .env に入れるための入口。
        # 例: PRICE_AUTO_SYNC=0  （複数行可・1行1件）
        # 秘密情報はここに書かない（ログに出ないが、Secretで渡すのが本筋）。
        description: "追加の環境変数（KEY=VALUE を1行1件。例 PRICE_AUTO_SYNC=0）"
        type: string
        required: false


concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Secret 設定チェック
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          # 入力があればそれを使う（Base IDは秘密でないため入力で渡せる）
          AIRTABLE_PRICE_BASE_ID: ${{ inputs.base_id != '' && inputs.base_id || secrets.AIRTABLE_PRICE_BASE_ID }}
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          EXTRA_ENV: ${{ inputs.extra_env }}
        run: |
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::VPS_SSH_KEY が未設定です。"
            exit 1
          fi
          n=0
          # 登録状況を「設定済み/未登録」だけで出す（値は絶対に出さない）
          for k in AIRTABLE_PAT AIRTABLE_PRICE_BASE_ID GBP_CLIENT_ID GBP_CLIENT_SECRET GBP_REFRESH_TOKEN; do
            v=$(printenv "$k" || true)
            [ -n "$v" ] && n=$((n+1)) || true
            echo "  $k=$([ -n "$v" ] && echo 登録済み || echo 未登録)"
          done
          [ -n "${EXTRA_ENV:-}" ] && n=$((n+1)) || true
          echo "投入対象: ${n} 件"
          if [ "$n" -eq 0 ]; then
            echo "::error::投入する値がありません。Settings → Secrets and variables → Actions で登録するか、extra_env に KEY=VALUE を書いてください。"
            exit 1
          fi

      - name: SSH 準備
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          if [[ "$VPS_SSH_KEY" == "-----BEGIN"* ]]; then
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          else
            echo "$VPS_SSH_KEY" | tr -d ' \n' | base64 -d > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY が秘密鍵として読めません。"
            exit 1
          fi
          ssh-keyscan -H 162.43.42.72 >> ~/.ssh/known_hosts 2>/dev/null

      - name: 投入する行を作る（ランナー内・ログに出さない）
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_PRICE_BASE_ID: ${{ inputs.base_id != '' && inputs.base_id || secrets.AIRTABLE_PRICE_BASE_ID }}
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          EXTRA_ENV: ${{ inputs.extra_env }}
        run: |
          umask 077
          # Base IDの形式を軽く検証（tbl…/viw…を貼り間違える事故が起きやすい）
          if [ -n "${AIRTABLE_PRICE_BASE_ID:-}" ]; then
            case "$AIRTABLE_PRICE_BASE_ID" in
              app*) : ;;
              *) echo "::error::AIRTABLE_PRICE_BASE_ID が app… で始まっていません（tbl…やviw…を渡していませんか）。"; exit 1 ;;
            esac
          fi
          : > /tmp/env-frag
          # 値は printf で1行ずつ。set -x はしない（値が出るため）。
          # キー名でループするので、対象を増やすときはこのリストに足すだけ。
          for k in AIRTABLE_PAT AIRTABLE_PRICE_BASE_ID GBP_CLIENT_ID GBP_CLIENT_SECRET GBP_REFRESH_TOKEN; do
            v=$(printenv "$k" || true)
            [ -n "$v" ] || continue
            # 改行入りの値は .env を壊す（貼り付け事故で起きやすい）。キー名だけ出して止める。
            # wc -l は改行の数を数えるので、1行の値なら 0 になる（値は出さない）
            if [ "$(printf '%s' "$v" | wc -l)" -ne 0 ]; then
              echo "::error::${k} に改行が含まれています。1行で貼り直してください。"
              exit 1
            fi
            printf '%s=%s\n' "$k" "$v" >> /tmp/env-frag
            echo "  投入: $k"
          done
          # 追加の環境変数（秘密でないフラグ等）。KEY=VALUE の形だけ受け付ける
          if [ -n "${EXTRA_ENV:-}" ]; then
            while IFS= read -r line; do
              line=$(printf '%s' "$line" | tr -d '\r')
              [ -n "$line" ] || continue
              case "$line" in
                \#*) continue ;;
                [A-Z_][A-Z0-9_]*=*) printf '%s\n' "$line" >> /tmp/env-frag; echo "  追加: ${line%%=*}" ;;
                *) echo "::error::extra_env の行が KEY=VALUE の形ではありません: ${line%%=*}"; exit 1 ;;
              esac
            done <<< "$EXTRA_ENV"
          fi
          echo "生成: $(wc -l < /tmp/env-frag) 行（値は表示しません）"

      - name: VPSの .env を更新してコンテナを作り直す
        env:
          RECREATE: ${{ inputs.recreate }}
        run: |
          # スクリプトは argv（base64）で渡し、**secretは stdin** で渡す。
          # スクリプト冒頭で stdin を読み切ってから docker を触る
          # （docker compose exec が stdin を食う問題を避ける）。
          SCRIPT=$(cat <<'REMOTE' | base64 -w0
          set -euo pipefail
          umask 077
          FRAG=/root/.mbfast-env-frag
          # 先に標準入力を読み切る（この後 docker を使うため）
          cat > "$FRAG"
          trap 'rm -f "$FRAG"' EXIT

          ENVFILE=/root/mbfast-app/.env
          if [ ! -f "$ENVFILE" ]; then
            echo "::error::$ENVFILE がありません。デプロイ先が想定と違います。"
            exit 1
          fi
          cp -a "$ENVFILE" "${ENVFILE}.bak.$(date +%Y%m%d%H%M%S)"

          # 同じキーの既存行を消してから追記する（重複させない・値は表示しない）
          KEYS=$(sed -n 's/^\([A-Z0-9_]*\)=.*/\1/p' "$FRAG")
          for k in $KEYS; do
            sed -i "/^${k}=/d" "$ENVFILE"
            echo "  ${k}: .env を更新"
          done
          cat "$FRAG" >> "$ENVFILE"
          chmod 600 "$ENVFILE"
          rm -f "$FRAG"

          if [ "${RECREATE:-yes}" = "yes" ]; then
            echo "== コンテナを作り直して反映 =="
            cd /root/mbfast-app
            docker compose -f docker-compose.prod.yml up -d 2>&1 | tail -20
            # 起動待ち（migrate deploy → next start）
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml exec -T app sh -c 'exit 0' </dev/null 2>/dev/null; then break; fi
              sleep 3
            done
            echo "== コンテナに渡っているかの確認（値は出さない） =="
            docker compose -f docker-compose.prod.yml exec -T app sh -c \
              'for k in AIRTABLE_PAT AIRTABLE_PRICE_BASE_ID GBP_CLIENT_ID GBP_CLIENT_SECRET GBP_REFRESH_TOKEN GBP_ACCOUNT_ID GBP_LOCATION_MAP GBP_MANAGER_EMAIL; do v=$(printenv "$k" || true); echo "  $k=$([ -n "$v" ] && echo 設定済み || echo 未設定)"; done' </dev/null
          else
            echo "（recreate=no のため .env の更新だけ。反映にはコンテナ作り直しが必要）"
          fi

          echo "MBFAST_SECRETS_INSTALLED"
          REMOTE
          )
          set -o pipefail
          ssh -i ~/.ssh/deploy_key \
              -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
              root@162.43.42.72 \
              "echo '$SCRIPT' | base64 -d > /tmp/mbfast-inst.sh && RECREATE='${RECREATE}' bash /tmp/mbfast-inst.sh; c=\$?; rm -f /tmp/mbfast-inst.sh; exit \$c" \
              < /tmp/env-frag 2>&1 | tee /tmp/inst-out.log

          shred -u /tmp/env-frag 2>/dev/null || rm -f /tmp/env-frag
          if ! grep -q MBFAST_SECRETS_INSTALLED /tmp/inst-out.log; then
            echo "::error::完走していません（完了マーカーなし）。ログを確認してください。"
            exit 1
          fi
          echo "::notice::投入と反映が完了しました。"
