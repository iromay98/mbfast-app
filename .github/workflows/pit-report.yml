# mbPIT の読み取り専用レポートを本番で実行する（DBには一切書き込まない）。
#
# 本番DBはホストに公開していないため、コンテナ内で実行する必要がある。
# 書き込み系（取込・掃除・Airtable）とは別ワークフローにして、
# **読み取りしかしないもの**だけをここに集める（誤って書き込む余地を作らない）。
#
# 必要な Secret: VPS_SSH_KEY（deploy.yml と共用）
name: mbPIT report (read only)

on:
  workflow_dispatch:
    inputs:
      report:
        description: "実行するレポート"
        type: choice
        options:
          - taxonomy # 投稿の区分と店舗マスタの棚卸し
          - usage # 店舗ごとの証明書・車両・投稿の件数
          - dealers # 代理店の棚卸し（ECU画面に入れない理由の切り分け）
          - gbp # Googleビジネスプロフィールの接続確認（GETのみ・投稿は作らない）
          - failures # 直近の投稿失敗の理由（PitPost.errorMessage・読み取りのみ）
          - system # VPSのメモリ・スワップ・ディスク・コンテナ使用量（読み取りのみ）
          - review # 公開前確認(review)で止まっている投稿の診断（読み取りのみ）
          - brands # 価格表ブランドの表示名・SEO説明の取り違え確認（読み取りのみ）
          - autotuner # AutoTuner API（.slave/.bak 変換）の直近の成否とエラー本文（読み取りのみ）
        default: taxonomy

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Secret 設定チェック
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::VPS_SSH_KEY が未設定です。"
            exit 1
          fi

      - name: SSH 準備
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          if [[ "$VPS_SSH_KEY" == "-----BEGIN"* ]]; then
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          else
            echo "$VPS_SSH_KEY" | tr -d ' \n' | base64 -d > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY が秘密鍵として読めません。"
            exit 1
          fi
          ssh-keyscan -H 162.43.42.72 >> ~/.ssh/known_hosts 2>/dev/null

      # リモートスクリプトはファイルで渡す（ssh の stdin に流すと docker compose exec が食べる）
      - name: リモートスクリプト生成
        run: |
          cat > /tmp/mbfast-report.sh <<'REMOTE'
          set -euo pipefail
          COMPOSE="docker compose -f /root/mbfast-app/docker-compose.prod.yml"
          echo "== report=${REPORT:-taxonomy} （読み取りのみ） =="

          case "${REPORT:-taxonomy}" in
            taxonomy)
              if ! $COMPOSE exec -T app test -f scripts/report-pit-taxonomy.mts </dev/null; then
                echo "::error::本番コンテナに report-pit-taxonomy.mts がありません。先に main をデプロイしてください。"
                exit 1
              fi
              $COMPOSE exec -T app npx tsx scripts/report-pit-taxonomy.mts </dev/null
              ;;
            usage)
              $COMPOSE exec -T app npm run report:pit-usage </dev/null
              ;;
            failures)
              # 直近の投稿失敗。errorMessage はWP/AIのエラー本文を含むことがあるので300文字で切る。
              # コンテナ内のスクリプトに依存しない（デプロイ待ちなしで使える）ようpsqlで直接引く。
              echo "-- 直近の PitPost（failed / processing）--"
              $COMPOSE exec -T postgres psql -U mbfast -d mbfast -c \
                "SELECT to_char(\"createdAt\" AT TIME ZONE 'Asia/Tokyo','MM-DD HH24:MI') AS jst, status, vehicle, left(coalesce(\"errorMessage\",''),300) AS error FROM \"PitPost\" WHERE status IN ('failed','processing') ORDER BY \"createdAt\" DESC LIMIT 10;" </dev/null
              echo ""
              # 「失敗の記録が無い」ときの切り分け: 全ステータスの直近投稿（そもそも届いたか）と、
              # mbPITに限らないエラーログ（届いたがパイプラインの外で落ちたか）を出す
              echo "-- 直近の PitPost（全ステータス・店舗つき） --"
              $COMPOSE exec -T postgres psql -U mbfast -d mbfast -c \
                "SELECT to_char(p.\"createdAt\" AT TIME ZONE 'Asia/Tokyo','MM-DD HH24:MI') AS jst, p.status, s.\"displayName\" AS store, p.vehicle FROM \"PitPost\" p JOIN \"PitStore\" s ON s.id=p.\"storeId\" ORDER BY p.\"createdAt\" DESC LIMIT 12;" </dev/null
              echo ""
              echo "-- 直近のアプリログ（エラーらしき行のみ・全体から） --"
              docker logs --since 24h mbfast-app-app-1 2>&1 | grep -viE "GET |POST .*200" | grep -iE "error|Error|失敗|exception|413|timeout" | tail -40 || echo "（該当ログなし）"
              echo ""
              echo "-- Caddyログ（4xx/5xx・直近） --"
              docker logs --since 24h mbfast-app-caddy-1 2>&1 | grep -E '"status":(4|5)[0-9][0-9]' | tail -20 || echo "（該当ログなし）"
              ;;
            gbp)
              # 接続確認。**投稿は作らない**（accounts/locations の一覧と localPosts のGETのみ）。
              # 認証情報が渡っているかを先に見る（値は出さない）。
              echo "-- 認証情報の有無（値は表示しない） --"
              $COMPOSE exec -T app sh -c 'for k in GBP_CLIENT_ID GBP_CLIENT_SECRET GBP_REFRESH_TOKEN GBP_ACCOUNT_ID GBP_LOCATION_MAP GBP_MANAGER_EMAIL; do v=$(printenv "$k" || true); echo "  $k=$([ -n "$v" ] && echo 設定済み || echo 未設定)"; done' </dev/null
              echo ""
              echo "-- アカウント／ロケーションの一覧 --"
              $COMPOSE exec -T app npm run gbp:accounts </dev/null || echo "（gbp:accounts が失敗。下のv4確認も見てください）"
              echo ""
              echo "-- v4の割り当て確認（GET localPosts のみ・投稿は作らない） --"
              $COMPOSE exec -T app npm run gbp:v4check </dev/null || echo "（gbp:v4check が失敗）"
              ;;
            review)
              # 公開前確認で止まっている投稿の診断。approveMyPitPost が弾く条件を先に確認する:
              #   wpPostId が NULL → 「WordPressの記事が見つかりません」で公開できない
              #   bodyHtml が NULL → 本部画面のプレビューが出せない
              # さらにWP側の実際の記事状態（draft/publish）もRESTで読む（GETのみ・書き込まない）。
              # 本番コンテナに新UIが実際に入っているかの確認（デプロイ反映漏れの切り分け）。
              # ビルド成果物に画面の見出し文字列が含まれているかをgrepするだけ（読み取りのみ）。
              echo "-- 本番コンテナのUI反映確認 --"
              for marker in "公開前の確認待ち" "内容を見る・調整する" "下書きに反映"; do
                if $COMPOSE exec -T app sh -c "grep -rlF '$marker' .next/server >/dev/null 2>&1" </dev/null; then
                  echo "  ✓ \"$marker\" を含む（反映済み）"
                else
                  echo "  ✗ \"$marker\" が見つからない（未反映の可能性）"
                fi
              done
              echo ""
              echo "-- review で止まっている投稿 --"
              $COMPOSE exec -T postgres psql -U mbfast -d mbfast -c \
                "SELECT p.id, to_char(p.\"createdAt\" AT TIME ZONE 'Asia/Tokyo','MM-DD HH24:MI') AS jst, s.\"displayName\" AS store, p.vehicle, p.\"wpPostId\", (p.\"bodyHtml\" IS NOT NULL) AS has_body, s.\"postReviewRequired\" AS review_on FROM \"PitPost\" p JOIN \"PitStore\" s ON s.id=p.\"storeId\" WHERE p.status='review' ORDER BY p.\"createdAt\" DESC;" </dev/null
              echo ""
              echo "-- WP側の実際の記事状態（GETのみ・書き込まない） --"
              IDS=$($COMPOSE exec -T postgres psql -U mbfast -d mbfast -tAc \
                "SELECT \"wpPostId\" FROM \"PitPost\" WHERE status='review' AND \"wpPostId\" IS NOT NULL ORDER BY \"createdAt\" DESC;" </dev/null | tr -d '\r' | tr '\n' ' ')
              echo "  対象WP記事ID: ${IDS:-（なし）}"
              if [ -n "${IDS// /}" ]; then
                $COMPOSE exec -T app node -e '
                  const ids = process.argv.slice(1);
                  const base = process.env.WP_BASE_URL || "https://mbfasttuning.com";
                  const auth = "Basic " + Buffer.from(process.env.WP_USER + ":" + process.env.WP_APP_PASSWORD).toString("base64");
                  (async () => {
                    for (const id of ids) {
                      try {
                        const r = await fetch(base + "/wp-json/wp/v2/posts/" + id + "?context=edit&_fields=id,status,date,link", { headers: { Authorization: auth } });
                        const j = await r.json();
                        console.log("  WP:" + id + " HTTP" + r.status + " status=" + j.status + " date=" + j.date);
                      } catch (e) { console.log("  WP:" + id + " 取得失敗 " + e.message); }
                    }
                  })();
                ' $IDS </dev/null
              fi
              ;;
            brands)
              # ブランド設定の取り違え検査。/hq/prices のブランド設定フォームが
              # タブ切替時に前のブランドの値を残す不具合があったため、
              # 「表示名が別ブランド名を含む」「SEO説明/導入文が他ブランドと同一」を洗い出す。
              echo "-- ブランドの表示名・SEO説明・導入文（先頭60文字） --"
              $COMPOSE exec -T postgres psql -U mbfast -d mbfast -c \
                "SELECT id, \"displayName\", left(coalesce(\"jsonLdDescription\",''),60) AS seo, left(coalesce(intro,''),40) AS intro, \"wordPressPageId\" AS wp FROM \"PriceBrand\" ORDER BY \"displayName\";" </dev/null
              echo ""
              echo "-- SEO説明が複数ブランドで重複しているもの（取り違えの疑い） --"
              $COMPOSE exec -T postgres psql -U mbfast -d mbfast -c \
                "SELECT left(\"jsonLdDescription\",70) AS seo, count(*) AS 件数, string_agg(id, ', ' ORDER BY id) AS brands FROM \"PriceBrand\" WHERE coalesce(\"jsonLdDescription\",'') <> '' GROUP BY \"jsonLdDescription\" HAVING count(*) > 1;" </dev/null
              echo ""
              echo "-- 導入文が複数ブランドで重複しているもの --"
              $COMPOSE exec -T postgres psql -U mbfast -d mbfast -c \
                "SELECT left(intro,70) AS intro, count(*) AS 件数, string_agg(id, ', ' ORDER BY id) AS brands FROM \"PriceBrand\" WHERE coalesce(intro,'') <> '' GROUP BY intro HAVING count(*) > 1;" </dev/null
              ;;
            autotuner)
              # 案件チャットの「.slave/.bak に変換して送信」が失敗したときの切り分け。
              # AutotunerApiLog に mode（encrypt-maps / encrypt-backup 等）とHTTPステータス、
              # エラー本文が残る。ここに行が無い＝AutoTunerへ届く前（アップロード段階）で落ちている。
              echo "-- 直近のAutoTuner API呼び出し（成否とエラー本文） --"
              $COMPOSE exec -T postgres psql -U mbfast -d mbfast -c \
                "SELECT to_char(\"createdAt\" AT TIME ZONE 'Asia/Tokyo','MM-DD HH24:MI') AS jst, mode, \"httpStatus\" AS http, success, left(coalesce(error,''),300) AS error FROM \"AutotunerApiLog\" ORDER BY \"createdAt\" DESC LIMIT 20;" </dev/null
              echo ""
              echo "-- 直近24時間の失敗をmode別に集計 --"
              $COMPOSE exec -T postgres psql -U mbfast -d mbfast -c \
                "SELECT mode, \"httpStatus\" AS http, count(*) AS 件数, max(left(coalesce(error,''),200)) AS 例 FROM \"AutotunerApiLog\" WHERE success = false AND \"createdAt\" > now() - interval '24 hours' GROUP BY mode, \"httpStatus\" ORDER BY 件数 DESC;" </dev/null
              echo ""
              echo "-- アプリログ（アップロード・変換まわりのエラー行のみ） --"
              docker logs --since 6h mbfast-app-app-1 2>&1 | grep -iE "暗号化|autotuner|zip|Server Action|413|body exceeded|PayloadTooLarge|ECONNRESET|abort" | tail -40 || echo "（該当ログなし）"
              echo ""
              echo "-- Caddyログ（4xx/5xx・直近6時間） --"
              docker logs --since 6h mbfast-app-caddy-1 2>&1 | grep -E '"status":(4|5)[0-9][0-9]' | tail -20 || echo "（該当ログなし）"
              ;;
            system)
              # VPSのリソース状況（アップロード上限の判断材料などに使う。読み取りのみ）
              echo "-- メモリ・スワップ --"
              free -m
              echo ""
              echo "-- ディスク --"
              df -h / /root 2>/dev/null | sort -u
              echo ""
              echo "-- storageディレクトリの使用量 --"
              du -sh /root/mbfast-app/storage 2>/dev/null || echo "（storage なし）"
              echo ""
              echo "-- コンテナごとの使用量（瞬間値） --"
              docker stats --no-stream --format "table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}"
              ;;
            dealers)
              if ! $COMPOSE exec -T app test -f scripts/report-dealers.mts </dev/null; then
                echo "::error::本番コンテナに report-dealers.mts がありません。先に main をデプロイしてください。"
                exit 1
              fi
              $COMPOSE exec -T app npx tsx scripts/report-dealers.mts </dev/null
              ;;
            *)
              echo "::error::未知のレポート: ${REPORT:-}"; exit 1 ;;
          esac

          echo "MBFAST_REPORT_COMPLETED"
          REMOTE
          sed -i 's/^          //' /tmp/mbfast-report.sh

      - name: 実行
        env:
          REPORT: ${{ inputs.report }}
        run: |
          B64=$(base64 -w0 /tmp/mbfast-report.sh)
          set -o pipefail
          ssh -i ~/.ssh/deploy_key \
              -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
              root@162.43.42.72 \
              "echo '$B64' | base64 -d > /tmp/mbfast-report.sh && REPORT='${REPORT}' bash /tmp/mbfast-report.sh; c=\$?; rm -f /tmp/mbfast-report.sh; exit \$c" \
              2>&1 | tee /tmp/report-out.log

          if ! grep -q MBFAST_REPORT_COMPLETED /tmp/report-out.log; then
            echo "::error::レポートが完走していません。ログを確認してください。"
            exit 1
          fi
          echo "::notice::完走しました。"
