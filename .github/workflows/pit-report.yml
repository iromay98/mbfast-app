# mbPIT の読み取り専用レポートを本番で実行する（DBには一切書き込まない）。
#
# 本番DBはホストに公開していないため、コンテナ内で実行する必要がある。
# 書き込み系（取込・掃除・Airtable）とは別ワークフローにして、
# **読み取りしかしないもの**だけをここに集める（誤って書き込む余地を作らない）。
#
# 必要な Secret: VPS_SSH_KEY（deploy.yml と共用）
name: mbPIT report (read only)

on:
  workflow_dispatch:
    inputs:
      report:
        description: "実行するレポート"
        type: choice
        options:
          - taxonomy # 投稿の区分と店舗マスタの棚卸し
          - usage # 店舗ごとの証明書・車両・投稿の件数
          - dealers # 代理店の棚卸し（ECU画面に入れない理由の切り分け）
          - gbp # Googleビジネスプロフィールの接続確認（GETのみ・投稿は作らない）
          - failures # 直近の投稿失敗の理由（PitPost.errorMessage・読み取りのみ）
          - system # VPSのメモリ・スワップ・ディスク・コンテナ使用量（読み取りのみ）
        default: taxonomy

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Secret 設定チェック
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::VPS_SSH_KEY が未設定です。"
            exit 1
          fi

      - name: SSH 準備
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          if [[ "$VPS_SSH_KEY" == "-----BEGIN"* ]]; then
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          else
            echo "$VPS_SSH_KEY" | tr -d ' \n' | base64 -d > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY が秘密鍵として読めません。"
            exit 1
          fi
          ssh-keyscan -H 162.43.42.72 >> ~/.ssh/known_hosts 2>/dev/null

      # リモートスクリプトはファイルで渡す（ssh の stdin に流すと docker compose exec が食べる）
      - name: リモートスクリプト生成
        run: |
          cat > /tmp/mbfast-report.sh <<'REMOTE'
          set -euo pipefail
          COMPOSE="docker compose -f /root/mbfast-app/docker-compose.prod.yml"
          echo "== report=${REPORT:-taxonomy} （読み取りのみ） =="

          case "${REPORT:-taxonomy}" in
            taxonomy)
              if ! $COMPOSE exec -T app test -f scripts/report-pit-taxonomy.mts </dev/null; then
                echo "::error::本番コンテナに report-pit-taxonomy.mts がありません。先に main をデプロイしてください。"
                exit 1
              fi
              $COMPOSE exec -T app npx tsx scripts/report-pit-taxonomy.mts </dev/null
              ;;
            usage)
              $COMPOSE exec -T app npm run report:pit-usage </dev/null
              ;;
            failures)
              # 直近の投稿失敗。errorMessage はWP/AIのエラー本文を含むことがあるので300文字で切る。
              # コンテナ内のスクリプトに依存しない（デプロイ待ちなしで使える）ようpsqlで直接引く。
              echo "-- 直近の PitPost（failed / processing）--"
              $COMPOSE exec -T postgres psql -U mbfast -d mbfast -c \
                "SELECT to_char(\"createdAt\" AT TIME ZONE 'Asia/Tokyo','MM-DD HH24:MI') AS jst, status, vehicle, left(coalesce(\"errorMessage\",''),300) AS error FROM \"PitPost\" WHERE status IN ('failed','processing') ORDER BY \"createdAt\" DESC LIMIT 10;" </dev/null
              echo ""
              # 「失敗の記録が無い」ときの切り分け: 全ステータスの直近投稿（そもそも届いたか）と、
              # mbPITに限らないエラーログ（届いたがパイプラインの外で落ちたか）を出す
              echo "-- 直近の PitPost（全ステータス・店舗つき） --"
              $COMPOSE exec -T postgres psql -U mbfast -d mbfast -c \
                "SELECT to_char(p.\"createdAt\" AT TIME ZONE 'Asia/Tokyo','MM-DD HH24:MI') AS jst, p.status, s.\"displayName\" AS store, p.vehicle FROM \"PitPost\" p JOIN \"PitStore\" s ON s.id=p.\"storeId\" ORDER BY p.\"createdAt\" DESC LIMIT 12;" </dev/null
              echo ""
              echo "-- 直近のアプリログ（エラーらしき行のみ・全体から） --"
              docker logs --since 24h mbfast-app-app-1 2>&1 | grep -viE "GET |POST .*200" | grep -iE "error|Error|失敗|exception|413|timeout" | tail -40 || echo "（該当ログなし）"
              echo ""
              echo "-- Caddyログ（4xx/5xx・直近） --"
              docker logs --since 24h mbfast-app-caddy-1 2>&1 | grep -E '"status":(4|5)[0-9][0-9]' | tail -20 || echo "（該当ログなし）"
              ;;
            gbp)
              # 接続確認。**投稿は作らない**（accounts/locations の一覧と localPosts のGETのみ）。
              # 認証情報が渡っているかを先に見る（値は出さない）。
              echo "-- 認証情報の有無（値は表示しない） --"
              $COMPOSE exec -T app sh -c 'for k in GBP_CLIENT_ID GBP_CLIENT_SECRET GBP_REFRESH_TOKEN GBP_ACCOUNT_ID GBP_LOCATION_MAP GBP_MANAGER_EMAIL; do v=$(printenv "$k" || true); echo "  $k=$([ -n "$v" ] && echo 設定済み || echo 未設定)"; done' </dev/null
              echo ""
              echo "-- アカウント／ロケーションの一覧 --"
              $COMPOSE exec -T app npm run gbp:accounts </dev/null || echo "（gbp:accounts が失敗。下のv4確認も見てください）"
              echo ""
              echo "-- v4の割り当て確認（GET localPosts のみ・投稿は作らない） --"
              $COMPOSE exec -T app npm run gbp:v4check </dev/null || echo "（gbp:v4check が失敗）"
              ;;
            system)
              # VPSのリソース状況（アップロード上限の判断材料などに使う。読み取りのみ）
              echo "-- メモリ・スワップ --"
              free -m
              echo ""
              echo "-- ディスク --"
              df -h / /root 2>/dev/null | sort -u
              echo ""
              echo "-- storageディレクトリの使用量 --"
              du -sh /root/mbfast-app/storage 2>/dev/null || echo "（storage なし）"
              echo ""
              echo "-- コンテナごとの使用量（瞬間値） --"
              docker stats --no-stream --format "table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}"
              ;;
            dealers)
              if ! $COMPOSE exec -T app test -f scripts/report-dealers.mts </dev/null; then
                echo "::error::本番コンテナに report-dealers.mts がありません。先に main をデプロイしてください。"
                exit 1
              fi
              $COMPOSE exec -T app npx tsx scripts/report-dealers.mts </dev/null
              ;;
            *)
              echo "::error::未知のレポート: ${REPORT:-}"; exit 1 ;;
          esac

          echo "MBFAST_REPORT_COMPLETED"
          REMOTE
          sed -i 's/^          //' /tmp/mbfast-report.sh

      - name: 実行
        env:
          REPORT: ${{ inputs.report }}
        run: |
          B64=$(base64 -w0 /tmp/mbfast-report.sh)
          set -o pipefail
          ssh -i ~/.ssh/deploy_key \
              -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
              root@162.43.42.72 \
              "echo '$B64' | base64 -d > /tmp/mbfast-report.sh && REPORT='${REPORT}' bash /tmp/mbfast-report.sh; c=\$?; rm -f /tmp/mbfast-report.sh; exit \$c" \
              2>&1 | tee /tmp/report-out.log

          if ! grep -q MBFAST_REPORT_COMPLETED /tmp/report-out.log; then
            echo "::error::レポートが完走していません。ログを確認してください。"
            exit 1
          fi
          echo "::notice::完走しました。"
