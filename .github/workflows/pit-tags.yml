# mbPIT: 公開済みWP記事の後追いメンテナンス。
#
#   job=tags  … 既存記事に施工区分のタグを遡って付ける
#               （ポータルのジャンル絞り込みが記事タグを参照するため。
#                 tags 未実装の時期に投稿された記事にはタグが無い）
#   job=slug  … WP側のカテゴリslugに合わせてアプリの店舗slugを揃える（slugのみ／DB）
#   job=name  … 店舗の表示名を変える（store_slug と store_name の入力が必要／DB）
#               命名の原則は「slugは英小文字・表示名は日本語」
#   job=add   … WPにカテゴリはあるがアプリに無い店舗を店舗マスタへ登録する
#               （store_slug / store_name / wp_category の入力が必要／DB）
#   job=links … 記事末尾の「施工店」リンクを現在の店舗slugに直す
#               （slugは投稿時に焼き込まれるので、改名すると過去記事だけ404になる）
#
# 店舗が改名したときは slug → links の順に回す（アプリのslugを直してから記事を直す）。
#
# 仕組みは他の運用ワークフローと同じ:
#   本番VPSへSSH → 本番コンテナ内で実行（DBもWP認証もコンテナ内にしか無い）。
#
# 安全策:
#   - mode=diff（既定）は **WPへ書き込まない**（何をするかを出すだけ）
#   - mode=push のときだけ書き込み。confirm に TAGS と入力も必須
#   - push でも必ず先に diff を出してから実行する
#   - tags: タグは足すだけ（既存タグを消さない）／本文・状態・カテゴリには触れない
#   - links: `<HUB>/<1セグメント>/` のURLだけ置換／他店舗のslugを指すリンクは触らない
#   - 完了マーカーが無ければ workflow を失敗させる（空振りを success にしない）
#
# 必要な Secret: VPS_SSH_KEY（deploy.yml と共用）
name: mbPIT post maintenance

on:
  workflow_dispatch:
    inputs:
      job:
        description: "tags=区分タグの遡及付与 / slug=店舗slugをWPに合わせる / name=表示名の変更 / add=店舗の新規登録 / links=店舗リンクの修正"
        type: choice
        options: [tags, slug, name, add, links]
        default: tags
      store_slug:
        description: "job=name / add のときの店舗slug（英小文字。例 glanzcoat）"
        type: string
        required: false
      store_name:
        description: "job=name / add のときの表示名（日本語形があれば日本語。例 プレジャー）"
        type: string
        required: false
      wp_category:
        description: "job=add のときのWPカテゴリID（親545直下。例 555）"
        type: string
        required: false
      dealer_id:
        description: "job=add で既存代理店に紐付ける場合の代理店ID。空なら本店直営として登録"
        type: string
        required: false
      mode:
        description: "diff=内容を見るだけ / push=WPへ書き込む"
        type: choice
        options: [diff, push]
        default: diff
      confirm:
        description: "push のときは job名を大文字で入力（TAGS / SLUG / LINKS）。diff では不要"
        type: string
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  tags:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 確認ワードチェック
        env:
          JOB: ${{ inputs.job }}
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          WANT=$(echo "$JOB" | tr '[:lower:]' '[:upper:]')
          if [ "$MODE" = "push" ] && [ "$CONFIRM" != "$WANT" ]; then
            echo "::error::mode=push のときは confirm に $WANT と入力してください（誤爆防止）。"
            exit 1
          fi

      - name: Secret 設定チェック
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::VPS_SSH_KEY が未設定です。"
            exit 1
          fi

      - name: SSH 準備
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          if [[ "$VPS_SSH_KEY" == "-----BEGIN"* ]]; then
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          else
            echo "$VPS_SSH_KEY" | tr -d ' \n' | base64 -d > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY が秘密鍵として読めません。"
            exit 1
          fi
          ssh-keyscan -H 162.43.42.72 >> ~/.ssh/known_hosts 2>/dev/null

      # リモートスクリプトはファイルで渡す（ssh の stdin に流すと docker compose exec が食べる）
      - name: リモートスクリプト生成
        run: |
          cat > /tmp/mbfast-pit-tags.sh <<'REMOTE'
          set -euo pipefail
          COMPOSE="docker compose -f /root/mbfast-app/docker-compose.prod.yml"
          echo "== job=${JOB:-tags} mode=${MODE:-diff} =="

          ARGS=""
          case "${JOB:-tags}" in
            tags)  SCRIPT=scripts/pit-backfill-tags.mts ;;
            slug)  SCRIPT=scripts/pit-sync-store-slug.mts ;;
            links) SCRIPT=scripts/pit-fix-store-links.mts ;;
            name)
              SCRIPT=scripts/pit-set-store-name.mts
              if [ -z "${STORE_SLUG:-}" ] || [ -z "${STORE_NAME_B64:-}" ]; then
                echo "::error::job=name には store_slug と store_name の両方が必要です。"
                exit 1
              fi
              # 表示名は日本語なので base64 で渡す（シェルの引用符事故を避ける）
              ARGS="--slug=${STORE_SLUG} --name-b64=${STORE_NAME_B64}"
              ;;
            add)
              SCRIPT=scripts/pit-add-store.mts
              if [ -z "${STORE_SLUG:-}" ] || [ -z "${STORE_NAME_B64:-}" ] || [ -z "${WP_CATEGORY:-}" ]; then
                echo "::error::job=add には store_slug / store_name / wp_category が必要です。"
                exit 1
              fi
              ARGS="--slug=${STORE_SLUG} --name-b64=${STORE_NAME_B64} --wp-category=${WP_CATEGORY}"
              if [ -n "${DEALER_ID:-}" ]; then ARGS="$ARGS --dealer=${DEALER_ID}"; fi
              ;;
            *) echo "::error::未知のジョブ: ${JOB:-}"; exit 1 ;;
          esac

          if ! $COMPOSE exec -T app test -f "$SCRIPT" </dev/null; then
            echo "::error::本番コンテナに $SCRIPT がありません。先に main をデプロイしてください。"
            exit 1
          fi

          # WP認証がコンテナに渡っているかを先に確認する（値は絶対に出さない）
          if ! $COMPOSE exec -T app sh -c '[ -n "$WP_USER" ] && [ -n "$WP_APP_PASSWORD" ]' </dev/null; then
            echo "::error::コンテナに WP_USER / WP_APP_PASSWORD が渡っていません。"
            exit 1
          fi

          # まず必ず差分（読み取りのみ）を出す
          echo "== 内容の確認（書き込まない） =="
          $COMPOSE exec -T app npx tsx "$SCRIPT" $ARGS </dev/null

          if [ "${MODE:-diff}" = "push" ]; then
            # slug / name / add は本番DBを書き換える。小さい変更でも戻せるようにしてから触る
            if [ "${JOB:-tags}" = "slug" ] || [ "${JOB:-tags}" = "name" ] || [ "${JOB:-tags}" = "add" ]; then
              STAMP=$(date +%Y%m%d-%H%M%S)
              echo "== 書き込み前に PitStore をダンプ（/root/backups/pitstore-$STAMP.sql） =="
              mkdir -p /root/backups
              $COMPOSE exec -T postgres pg_dump -U mbfast -d mbfast -t '"PitStore"' </dev/null \
                > "/root/backups/pitstore-$STAMP.sql"
              echo "  $(wc -l < "/root/backups/pitstore-$STAMP.sql") 行"
            fi
            echo "== 書き込み =="
            $COMPOSE exec -T app npx tsx "$SCRIPT" $ARGS --commit </dev/null
            # 書き込み後の確認。job=add だけは**同じスクリプトを再実行できない**
            # （新規登録は冪等ではなく、2回目は「slugが既にある」と正しく拒否する＝
            #   それを失敗と数えてはいけない）。店舗一覧が出る読み取り専用の方で確かめる。
            if [ "${JOB:-tags}" = "add" ]; then
              echo "== 登録後の確認（店舗一覧・読み取りのみ） =="
              $COMPOSE exec -T app npx tsx scripts/pit-sync-store-slug.mts </dev/null
            else
              echo "== 書き込み後の再確認（差分が消えているはず） =="
              $COMPOSE exec -T app npx tsx "$SCRIPT" $ARGS </dev/null
            fi
          else
            echo "（diff モードのため書き込んでいません）"
          fi

          echo "MBFAST_PIT_TAGS_COMPLETED"
          REMOTE
          sed -i 's/^          //' /tmp/mbfast-pit-tags.sh

      - name: 実行
        env:
          JOB: ${{ inputs.job }}
          MODE: ${{ inputs.mode }}
          STORE_SLUG: ${{ inputs.store_slug }}
          STORE_NAME: ${{ inputs.store_name }}
          WP_CATEGORY: ${{ inputs.wp_category }}
          DEALER_ID: ${{ inputs.dealer_id }}
        run: |
          # 表示名は日本語や空白を含むので base64 にしてから渡す（ssh のコマンド行で壊さない）
          STORE_NAME_B64=""
          if [ -n "$STORE_NAME" ]; then STORE_NAME_B64=$(printf '%s' "$STORE_NAME" | base64 -w0); fi
          # slug は英小文字・数字・ハイフンのみ（ここで弾いておく＝ssh のコマンド行に変な文字を載せない）
          if [ -n "$STORE_SLUG" ] && ! printf '%s' "$STORE_SLUG" | grep -qE '^[a-z0-9-]+$'; then
            echo "::error::store_slug は英小文字・数字・ハイフンのみです。"
            exit 1
          fi
          # ID・数値もコマンド行に載るので形式を先に確認する
          if [ -n "$WP_CATEGORY" ] && ! printf '%s' "$WP_CATEGORY" | grep -qE '^[0-9]+$'; then
            echo "::error::wp_category は数字のみです。"
            exit 1
          fi
          if [ -n "$DEALER_ID" ] && ! printf '%s' "$DEALER_ID" | grep -qE '^[A-Za-z0-9_-]+$'; then
            echo "::error::dealer_id の形式が不正です。"
            exit 1
          fi

          B64=$(base64 -w0 /tmp/mbfast-pit-tags.sh)
          set -o pipefail
          ssh -i ~/.ssh/deploy_key \
              -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
              root@162.43.42.72 \
              "echo '$B64' | base64 -d > /tmp/mbfast-pit-tags.sh && JOB='${JOB}' MODE='${MODE}' STORE_SLUG='${STORE_SLUG}' STORE_NAME_B64='${STORE_NAME_B64}' WP_CATEGORY='${WP_CATEGORY}' DEALER_ID='${DEALER_ID}' bash /tmp/mbfast-pit-tags.sh; c=\$?; rm -f /tmp/mbfast-pit-tags.sh; exit \$c" \
              2>&1 | tee /tmp/pit-tags-out.log

          if ! grep -q MBFAST_PIT_TAGS_COMPLETED /tmp/pit-tags-out.log; then
            echo "::error::完走していません（完了マーカーなし）。ログを確認してください。"
            exit 1
          fi
          echo "::notice::完走しました。"
