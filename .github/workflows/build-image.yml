# main への push で、ビルド→VPSデプロイまで全自動で行う。
#
# 経緯: 旧 deploy.yml は VPS へSSHして rsync 方式の deploy-vps.sh を実行しており、
# Git管理と衝突して「VPSに未コミット変更が現れ実装が消える」事故を繰り返した
# （2026-08-21/27/28）。rsyncは全廃し、本ワークフローに一本化する。
#
# 新方式:
#   build: GitHub側でイメージをビルドし ghcr.io へ push
#          （VPSは物理2GBでビルドすると3〜5分＋Swapでサイトまで重くなるため）
#   deploy: VPSへSSHし、git pull（compose定義の追従）→ イメージpull → 再起動 →
#           APP_GIT_SHA がこのコミットと一致するか検証（不一致なら失敗にする）
#
# 必要なSecret: VPS_SSH_KEY（設定済み）。ghcr.ioへのログインは GITHUB_TOKEN を
# SSH越しに渡して都度行う（VPSに永続トークンを置かない）。
name: build-and-deploy
on:
  push:
    branches: [main]
  workflow_dispatch: {}
concurrency:
  group: deploy-production
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/iromay98/mbfast-app:main
            ghcr.io/iromay98/mbfast-app:sha-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: SSH鍵の確認
        id: check
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS_SSH_KEY 未設定のためデプロイをスキップ（手動: git pull && compose pull app && up -d app）"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: デプロイ
        if: steps.check.outputs.configured == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          # Secretはbase64の1行形式（スマホ登録で改行が崩れないよう旧運用から継承）。
          # PEMそのままの登録にも対応する
          if [[ "$VPS_SSH_KEY" == "-----BEGIN"* ]]; then
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          else
            echo "$VPS_SSH_KEY" | tr -d ' \n' | base64 -d > ~/.ssh/id_deploy
          fi
          chmod 600 ~/.ssh/id_deploy
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY が秘密鍵として読めません（base64 -w0 した1行を登録してください）"
            exit 1
          fi
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new root@162.43.42.72 \
            "set -e; cd /root/mbfast-app; \
             git fetch origin main && git checkout -q main && git reset --hard origin/main; \
             echo '$GH_TOKEN' | docker login ghcr.io -u iromay98 --password-stdin >/dev/null; \
             docker compose -f docker-compose.prod.yml pull -q app; \
             docker compose -f docker-compose.prod.yml up -d app; \
             sleep 8; \
             RUNNING=\$(docker compose -f docker-compose.prod.yml exec -T app printenv APP_GIT_SHA); \
             echo \"running: \$RUNNING / expect: $SHA\"; \
             [ \"\$RUNNING\" = \"$SHA\" ]"
