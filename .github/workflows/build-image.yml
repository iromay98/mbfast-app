# 本番イメージをGitHub側でビルドする。
#
# 理由: VPSは物理2GBで、ビルドのたびに1.3GB超を消費してSwapに落ち、
# 3〜5分待たされるうえ稼働中のサイトまで重くなる。ビルドをここへ移せば
# VPSは出来上がったイメージを受け取るだけ（30秒前後・負荷ゼロ）になる。
#
# デプロイ手順（VPS側）:
#   git pull && docker compose -f docker-compose.prod.yml pull app \
#     && docker compose -f docker-compose.prod.yml up -d app
# 反映確認: docker compose -f docker-compose.prod.yml exec app printenv APP_GIT_SHA
name: build-image
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/iromay98/mbfast-app:main
            ghcr.io/iromay98/mbfast-app:sha-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          # レイヤーキャッシュ（依存が変わらない限りnpm ciを再利用＝2回目以降さらに速い）
          cache-from: type=gha
          cache-to: type=gha,mode=max
