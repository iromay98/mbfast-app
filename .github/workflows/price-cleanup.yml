# 価格マスターの重複掃除（Airtable由来コピー行＋新idと重複する旧ブランドid）をワンボタンで撃つ。
# 仕組みは price-import-commit.yml と同じ: 本番VPSへSSHし、本番コンテナ内で実行する。
#
# **代理店が貼っている本物のAirtableには触らない**（アプリDBの掃除のみ）。
# Airtableへ新料金を書き戻すのは別スクリプトの仕事。
#
# 安全策:
#   - mode=report（既定）は読み取りのみ。何を消すかログに出して終わる
#   - mode=delete のときだけ削除。confirm に CLEANUP の入力も必須
#   - 削除前に pg_dump 退避（0バイトなら中止）
#   - スクリプト側に「html行が無いブランドのairtable行は消さない」ガード
#   - 完了マーカーが無ければ workflow を失敗させる（空振りを success にしない）
#
# 必要な Secret: VPS_SSH_KEY（deploy.yml と共用）
name: Price cleanup (remove duplicate rows)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "report=何を消すか見るだけ / delete=実際に消す"
        type: choice
        options: [report, delete]
        default: report
      confirm:
        description: "delete のときは CLEANUP と入力（report では不要）"
        type: string
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 確認ワードチェック
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$MODE" = "delete" ] && [ "$CONFIRM" != "CLEANUP" ]; then
            echo "::error::mode=delete のときは confirm に CLEANUP と入力してください（誤爆防止）。"
            exit 1
          fi

      - name: Secret 設定チェック
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::VPS_SSH_KEY が未設定です。"
            exit 1
          fi

      - name: SSH 準備
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          if [[ "$VPS_SSH_KEY" == "-----BEGIN"* ]]; then
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          else
            echo "$VPS_SSH_KEY" | tr -d ' \n' | base64 -d > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY が秘密鍵として読めません。"
            exit 1
          fi
          ssh-keyscan -H 162.43.42.72 >> ~/.ssh/known_hosts 2>/dev/null

      # リモートで走らせるスクリプトはファイルとして渡す（ssh の stdin に流すと
      # docker compose exec がスクリプトの残りを食べて空振りする）。
      - name: リモートスクリプト生成
        run: |
          cat > /tmp/mbfast-cleanup.sh <<'REMOTE'
          set -euo pipefail
          COMPOSE="docker compose -f /root/mbfast-app/docker-compose.prod.yml"
          echo "== mode=${MODE:-report} =="

          if ! $COMPOSE exec -T app test -f scripts/price-sync/cleanup-legacy.mts </dev/null; then
            echo "::error::本番コンテナに cleanup-legacy.mts がありません。先に main をデプロイしてください。"
            exit 1
          fi

          echo "== 現在の件数 =="
          $COMPOSE exec -T postgres psql -U mbfast -d mbfast -A -F' | ' -c \
            'SELECT source, count(*) FROM "PriceVehicle" GROUP BY source ORDER BY source;' </dev/null || true

          # 何を消すかを必ず先に出す（report でも delete でも）
          echo "== 掃除対象の確認（読み取りのみ） =="
          $COMPOSE exec -T app npx tsx scripts/price-sync/cleanup-legacy.mts </dev/null

          if [ "${MODE:-report}" = "delete" ]; then
            TS=$(date +%Y%m%d%H%M%S)
            BK="/root/pricebackup_cleanup_${TS}.sql"
            $COMPOSE exec -T postgres pg_dump -U mbfast -d mbfast \
              -t '"PriceBrand"' -t '"PriceVehicle"' </dev/null > "$BK"
            SZ=$(stat -c%s "$BK" 2>/dev/null || echo 0)
            echo "退避: $BK (${SZ} bytes)"
            if [ "$SZ" -lt 100 ]; then
              echo "::error::pg_dump が空です（${SZ}バイト）。掃除を中止。"
              exit 1
            fi

            echo "== 削除実行 =="
            $COMPOSE exec -T app npx tsx scripts/price-sync/cleanup-legacy.mts \
              --commit --i-have-backed-up </dev/null

            echo "== 掃除後の件数 =="
            $COMPOSE exec -T postgres psql -U mbfast -d mbfast -A -F' | ' -c \
              'SELECT source, count(*) FROM "PriceVehicle" GROUP BY source ORDER BY source;' </dev/null || true
            $COMPOSE exec -T postgres psql -U mbfast -d mbfast -A -F' | ' -c \
              'SELECT id, (SELECT count(*) FROM "PriceVehicle" v WHERE v."brandId"=b.id) AS rows FROM "PriceBrand" b ORDER BY id;' </dev/null || true
            echo "退避ファイル: $BK"
          else
            echo "（report モードのため削除はしていません）"
          fi

          echo "MBFAST_CLEANUP_COMPLETED"
          REMOTE
          sed -i 's/^          //' /tmp/mbfast-cleanup.sh
          echo "--- 生成行数: $(wc -l < /tmp/mbfast-cleanup.sh) ---"

      - name: 掃除実行
        env:
          MODE: ${{ inputs.mode }}
        run: |
          B64=$(base64 -w0 /tmp/mbfast-cleanup.sh)
          set -o pipefail
          ssh -i ~/.ssh/deploy_key \
              -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
              root@162.43.42.72 \
              "echo '$B64' | base64 -d > /tmp/mbfast-cleanup.sh && MODE='${MODE}' bash /tmp/mbfast-cleanup.sh; c=\$?; rm -f /tmp/mbfast-cleanup.sh; exit \$c" \
              2>&1 | tee /tmp/cleanup-out.log

          if ! grep -q MBFAST_CLEANUP_COMPLETED /tmp/cleanup-out.log; then
            echo "::error::掃除が完走していません（完了マーカーなし）。ログを確認してください。"
            exit 1
          fi
          echo "::notice::完走しました。"
