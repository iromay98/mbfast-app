# 毎朝6時(JST)に過去ブログ記事を1件、本店GBPの「最新情報」へ投稿する。
# 実行はVPSコンテナ内（GBPトークン・DBがそこにしか無いため）。SSH鍵は既存のVPS_SSH_KEYを流用。
name: gbp-drip
on:
  schedule:
    - cron: "0 21 * * *"  # 21:00 UTC = 6:00 JST
  workflow_dispatch: {}
concurrency:
  group: gbp-drip
  cancel-in-progress: false
jobs:
  drip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 実行
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          if [[ "$VPS_SSH_KEY" == "-----BEGIN"* ]]; then
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          else
            echo "$VPS_SSH_KEY" | tr -d ' \n' | base64 -d > ~/.ssh/id_deploy
          fi
          chmod 600 ~/.ssh/id_deploy
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new root@162.43.42.72 \
            "cd /root/mbfast-app && docker compose -f docker-compose.prod.yml exec -T app npm run gbp:drip"
