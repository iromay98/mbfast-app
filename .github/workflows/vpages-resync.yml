# 車両ページの一括再反映を遠隔実行する(HQ画面の「全ページを再反映」と同等)。
# Claudeのチャット環境からはSSH不可のため、Actions経由でVPSコンテナ内のスクリプトを叩く。
name: vpages-resync
on:
  workflow_dispatch:
    inputs:
      brands:
        description: "ブランド(id/slugをスペース区切り。all=全部)"
        required: true
        default: "mb"
concurrency:
  group: vpages-resync
  cancel-in-progress: false
jobs:
  resync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 実行
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          BRANDS: ${{ github.event.inputs.brands }}
        run: |
          mkdir -p ~/.ssh
          if [[ "$VPS_SSH_KEY" == "-----BEGIN"* ]]; then
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          else
            echo "$VPS_SSH_KEY" | tr -d ' \n' | base64 -d > ~/.ssh/id_deploy
          fi
          chmod 600 ~/.ssh/id_deploy
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new root@162.43.42.72 \
            "cd /root/mbfast-app && docker compose -f docker-compose.prod.yml exec -T app npm run vpages:resync -- $BRANDS"
