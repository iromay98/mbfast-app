<script>
(function(){
  'use strict';
  var tbody=document.getElementById('daihatsuTableBody');
  if(!tbody)return;
  var rows=Array.prototype.slice.call(tbody.querySelectorAll('tr'));
  var searchInput=document.getElementById('daihatsuSearch');
  var clearBtn=document.getElementById('daihatsuClear');
  var countEl=document.getElementById('daihatsuResultCount');
  var noResultsEl=document.getElementById('daihatsuNoResults');
  var tableWrap=document.querySelector('.daihatsu-table-wrap');
  var state={query:'',series:'all'};
  function trim(s){return s.replace(/^\s+|\s+$/g,'');}
  function applyFilters(){
    var q=trim(state.query).toLowerCase();
    var visible=0;
    for(var i=0;rows.length>i;i++){
      var row=rows[i];
      var t=row.getAttribute('data-daihatsu-search')||'';
      var s=row.getAttribute('data-daihatsu-series')||'';
      var ms=!q||t.indexOf(q)!==-1;
      var mr=state.series==='all'||s===state.series;
      var show=false;
      if(ms){if(mr){show=true;}}
      if(show){row.classList.remove('daihatsu-hidden');visible++;}
      else{row.classList.add('daihatsu-hidden');}
    }
    if(countEl)countEl.textContent=visible;
    if(noResultsEl)noResultsEl.hidden=visible>0;
    if(tableWrap)tableWrap.style.display=visible>0?'':'none';
  }
  if(searchInput){searchInput.addEventListener('input',function(e){state.query=e.target.value;applyFilters();});}
  if(clearBtn){clearBtn.addEventListener('click',function(){if(searchInput)searchInput.value='';state.query='';applyFilters();if(searchInput)searchInput.focus();});}
  var btns=document.querySelectorAll('[data-daihatsu-filter-series]');
  Array.prototype.forEach.call(btns,function(b){
    b.addEventListener('click',function(){
      Array.prototype.forEach.call(btns,function(x){x.classList.remove('daihatsu-active');});
      b.classList.add('daihatsu-active');
      state.series=b.getAttribute('data-daihatsu-filter-series');
      applyFilters();
    });
  });
  function cellText(row,idx){
    var td=row.children[idx];
    return td?trim(td.textContent):'';
  }
  function isBlank(t){
    if(!t)return true;
    if(t.indexOf('LINE')!==-1)return true;
    return /^[—\-\s]*$/.test(t);
  }
  function numOf(t){
    var s=t.replace(/,/g,'');
    var m=s.match(/-?\d+(\.\d+)?/);
    return m?parseFloat(m[0]):null;
  }
  var headers=document.querySelectorAll('.daihatsu-price-table th.daihatsu-sortable');
  var ss={idx:null,asc:true};
  Array.prototype.forEach.call(headers,function(th,idx){
    th.addEventListener('click',function(){
      if(ss.idx===idx){ss.asc=!ss.asc;}else{ss.idx=idx;ss.asc=true;}
      Array.prototype.forEach.call(headers,function(h){h.classList.remove('daihatsu-sort-asc','daihatsu-sort-desc');});
      th.classList.add(ss.asc?'daihatsu-sort-asc':'daihatsu-sort-desc');
      var dir=ss.asc?1:-1;
      var sorted=rows.slice().sort(function(a,b){
        var av=cellText(a,idx),bv=cellText(b,idx);
        var ab=isBlank(av),bb=isBlank(bv);
        if(ab){if(bb)return 0;}
        if(ab)return 1;
        if(bb)return -1;
        var an=numOf(av),bn=numOf(bv);
        if(an!==null){if(bn!==null){if(an!==bn)return (an-bn)*dir;}}
        return av.localeCompare(bv,'ja')*dir;
      });
      for(var i=0;sorted.length>i;i++){tbody.appendChild(sorted[i]);}
    });
  });
})();
</script>
